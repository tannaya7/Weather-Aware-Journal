name = "weather-journal-server"
main = "src/index.js"
compatibility_date = "2026-09-01"

# Sends due daily reminders.
[triggers]
crons = ["*/15 * * * *"]

# Create with: npx wrangler kv namespace create JOURNAL
# then paste the id it prints here.
[[kv_namespaces]]
binding = "JOURNAL"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Comma-separated sites allowed to call this server from a browser.
ALLOWED_ORIGINS = "https://tannaya7.github.io,http://localhost:5173,http://localhost:4173"
# Contact for push services (required by Web Push).
VAPID_SUBJECT = "mailto:you@example.com"

# Secrets (set with `npx wrangler secret put NAME`, never committed):
#   ANTHROPIC_API_KEY   for AI reflections
#   VAPID_PUBLIC_KEY    from `npm run vapid-keys`
#   VAPID_PRIVATE_JWK   from `npm run vapid-keys`

# A separate copy for trying changes before they reach your real journal:
#   npx wrangler kv namespace create JOURNAL --env staging
#   (paste the id below, then)  npm run deploy:staging
# It has its own storage, so nothing here touches production data. It sends
# no daily reminders (no cron).
[env.staging]
name = "weather-journal-server-staging"

[[env.staging.kv_namespaces]]
binding = "JOURNAL"
id = "REPLACE_WITH_STAGING_KV_NAMESPACE_ID"

[env.staging.vars]
ALLOWED_ORIGINS = "http://localhost:5173,http://localhost:4173"
VAPID_SUBJECT = "mailto:you@example.com"
