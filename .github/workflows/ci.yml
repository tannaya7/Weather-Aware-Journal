name: Checks

# Runs on every pull request, and is called by the deploy workflow so a
# change only goes live if all of this passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The server's tests (worker/) run in the same suite and need its SDK.
      - run: npm ci --prefix worker
      # Known security holes in what ships to users (app and server).
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npm audit --omit=dev --audit-level=moderate --prefix worker
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails if the app got heavier than perf-budgets.json allows.
      - run: npm run check:budgets

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse (mobile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      # Scores on a slow phone over a slow network; limits in lighthouserc.json.
      - run: npx --yes @lhci/cli@0.15.1 autorun
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lighthouse-report
          path: lighthouse-report
          retention-days: 7

  visual:
    name: Visual comparison
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Pictures are compared against baselines made on the same platform.
      # Until Linux baselines are committed (run the "Update visual baselines"
      # workflow), there is nothing to compare against, so the rest is
      # skipped. (hashFiles() only works in steps, not in a job's `if`.)
      - id: baselines
        run: |
          if ls e2e/visual.spec.js-snapshots/*-linux.png >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Linux baselines committed yet; skipping visual comparison."
          fi
      - if: steps.baselines.outputs.found == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - if: steps.baselines.outputs.found == 'true'
        run: npm ci
      - if: steps.baselines.outputs.found == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.baselines.outputs.found == 'true'
        run: npm run test:visual
      - uses: actions/upload-artifact@v7
        if: failure() && steps.baselines.outputs.found == 'true'
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7
