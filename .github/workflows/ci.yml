name: Checks

# Runs on every pull request, and is called by the deploy workflow so a
# change only goes live if all of this passes.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # The server's tests (worker/) run in the same suite and need its SDK.
      - run: npm ci --prefix worker
      - run: npm run lint
      - run: npm test
      - run: npm run build
      # Fails if the app got heavier than perf-budgets.json allows.
      - run: npm run check:budgets

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  visual:
    name: Visual comparison
    runs-on: ubuntu-latest
    # Pictures are compared against baselines made on the same platform.
    # Until Linux baselines are committed (run the "Update visual baselines"
    # workflow), there is nothing to compare against, so this is skipped.
    if: ${{ hashFiles('e2e/visual.spec.js-snapshots/*-linux.png') != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:visual
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: test-results
          retention-days: 7
